name: Manual draft alpha release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved annotated tag (v1.0.0-alpha.N)
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Validate tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v1\.0\.0-alpha\.[0-9]+$') { throw 'Invalid alpha tag' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: cargo test --locked
        working-directory: apps/xyeena-island/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/xyeena-island/src-tauri
      - run: npm run tauri --workspace @xyeena/island -- build --bundles nsis
      - name: Draft prerelease and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $folder = 'apps/xyeena-island/src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem "$folder/*.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $exe) { throw 'Installer missing' }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content "$folder/SHA256SUMS.txt" -Encoding ascii
          gh release create $env:RELEASE_TAG $exe.FullName "$folder/SHA256SUMS.txt" --verify-tag --draft --prerelease --title "Xyeena Island $env:RELEASE_TAG (unsigned alpha)" --notes "Experimental unsigned alpha. Not enterprise-certified. Refer to SECURITY.md and release gates."
