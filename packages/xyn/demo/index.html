<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xyeena Mascot Concept — live rig</title>
<style>
:root{--bg:#0A0D17;--panel:#0F1322;--line:#1B2136;--ink:#EEF0FA;--mute:#8B93AD;--accent:#7C86FF;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(900px 500px at 50% 0,#151B33 0,transparent 70%),var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:940px;margin:0 auto;padding:36px 20px 64px}
h1{font-size:clamp(30px,6vw,46px);margin:0 0 6px;text-align:center;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{text-align:center;color:var(--mute);margin:0 0 28px}
canvas{display:block;touch-action:none}
.hero{display:grid;grid-template-columns:1fr minmax(0,520px) 1fr;align-items:center;gap:16px}
.hero .mid{position:relative}
.hero canvas{width:100%;height:auto;aspect-ratio:1}
.hint{grid-column:1/-1;text-align:center;color:var(--mute);font-size:13px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:26px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 6px 12px;text-align:center;cursor:pointer;font:inherit;color:inherit;transition:border-color .2s,transform .2s}
.tile:hover{border-color:#3A4470}.tile[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tile:active{transform:scale(.97)}
.tile:focus-visible,.pill:focus-visible{outline:2px solid #8FA0FF;outline-offset:2px}
.tile canvas{width:100%;height:auto;aspect-ratio:1}
.tile span{font:12.5px var(--mono);color:#BFC5DE}
.row-title{font:12.5px var(--mono);color:var(--mute);margin:26px 0 -6px}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
.scene{position:relative;height:250px;background:linear-gradient(180deg,#10152A,#0B0F1E);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.scene .floor{position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#4F5FFF,transparent);box-shadow:0 0 18px 2px #4F5FFF88}
.peek canvas{position:absolute;left:-70px;bottom:-110px;width:300px;height:300px}
.paw{position:absolute;bottom:6px;width:34px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#F4E6D2);box-shadow:0 0 0 2px #F0CFA0 inset}
.list{position:absolute;right:20px;top:42px;width:48%;display:grid;gap:10px}
.list i{display:flex;align-items:center;gap:10px;height:36px;border-radius:12px;background:#171C30;padding:0 12px}
.list i::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.list i::after{content:"";height:7px;flex:1;max-width:70%;border-radius:4px;background:#3A4160}
.work canvas{position:absolute;left:30px;bottom:-30px;width:260px;height:260px}
.laptop{position:absolute;left:96px;bottom:12px;width:150px;height:66px;border-radius:10px 10px 4px 4px;background:linear-gradient(#1A2036,#0B0F1E);border:1px solid #2C3558;transform:skewX(-6deg)}
.laptop::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#4F9BFF;box-shadow:0 0 10px #4F9BFF}
.panel{position:absolute;border-radius:12px;background:#121830cc;border:1px solid #2A3358;padding:10px}
.chart{right:22px;top:20px;width:42%;height:92px}
.chart svg{width:100%;height:100%}
.check{right:16px;top:124px;width:40%;display:grid;gap:8px}
.check i{display:flex;gap:8px;align-items:center}
.check i::before{content:"✓";display:grid;place-items:center;width:16px;height:16px;border-radius:4px;background:#2C5FD8;font-size:11px;font-style:normal}
.check i::after{content:"";height:6px;flex:1;border-radius:3px;background:#3A4160}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.pill{font:12.5px var(--mono);background:var(--panel);color:#C9CFE8;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.pill[aria-pressed=true]{background:#232B52;border-color:var(--accent);color:#fff}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero .side{display:none}.grid{grid-template-columns:repeat(3,1fr)}.scenes{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Xyeena <span>Mascot Concept</span></h1>
  <p class="sub">Live Canvas rig — move your cursor, click the lion, switch state or accessory.</p>

  <section class="hero" aria-label="Hero">
    <div class="side"></div>
    <div class="mid"><canvas id="hero" aria-label="Xyeena lion mascot" role="img"></canvas></div>
    <div class="side"></div>
    <p class="hint">Click = poke · double-click = hop · eyes follow the pointer, the head lags a beat behind</p>
  </section>

  <div class="pills" id="statePills" role="group" aria-label="Hero state"></div>
  <div class="pills" id="variantPills" role="group" aria-label="Hero accessory"></div>

  <p class="row-title">states</p>
  <div class="grid" id="states"></div>
  <p class="row-title">accessories</p>
  <div class="grid" id="variants"></div>

  <div class="scenes">
    <div class="scene peek" aria-label="Peek scene">
      <canvas id="peek"></canvas><span class="paw" style="left:20px"></span><span class="paw" style="left:150px"></span>
      <div class="list"><i style="--c:#4F8BFF"></i><i style="--c:#B37BFF"></i><i style="--c:#8A92AA"></i></div>
      <div class="floor"></div>
    </div>
    <div class="scene work" aria-label="Workstation scene">
      <canvas id="work"></canvas><div class="laptop"></div>
      <div class="panel chart"><svg viewBox="0 0 160 70" fill="none"><path d="M4 56 L34 34 L60 44 L96 20 L124 30 L154 8" stroke="#5B93FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="154" cy="8" r="4" fill="#9DBDFF"/></svg></div>
      <div class="panel check"><i></i><i></i><i></i></div>
      <div class="floor"></div>
    </div>
  </div>
</main>

<script type="module">
import { LivingLionRig } from '../src/lion-canvas.js';

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rigs = [];
const make = (canvas, size, opts = {}) => {
  const r = new LivingLionRig(canvas, { size, reducedMotion: reduce, ...opts });
  r.start(); rigs.push(r); return r;
};

// hero
const heroEl = document.getElementById('hero');
const hero = make(heroEl, Math.min(520, heroEl.parentElement.clientWidth || 520));
addEventListener('resize', () => hero.resize(Math.min(520, heroEl.parentElement.clientWidth)));
heroEl.style.cursor = 'pointer';
heroEl.addEventListener('click', () => hero.squash(1));
heroEl.addEventListener('dblclick', () => hero.hop(1));

// pointer → gaze for everyone
addEventListener('pointermove', e => rigs.forEach(r => r.setGazeFromClient(e.clientX, e.clientY)), { passive: true });
addEventListener('pointerleave', () => rigs.forEach(r => r.setGaze(0, 0)));

// state + variant controls
const STATE_TILES = ['idle', 'working', 'thinking', 'question', 'finished'];
const VARIANT_TILES = ['standard', 'visor', 'crown', 'headset', 'shield'];
const ALL_STATES = ['idle','working','thinking','searching','question','approval','finished','error','rate_limit','sleeping','dizzy','greeting','upload','yawn','surprised','proud','wink','annoyed','love','dancing'];
let curState = 'idle', curVariant = 'standard';

const mkTile = (host, label, opts, onClick) => {
  const b = document.createElement('button'); b.className = 'tile'; b.type = 'button';
  const c = document.createElement('canvas'); const s = document.createElement('span'); s.textContent = label;
  b.append(c, s); host.append(b);
  const r = make(c, 150, opts); b.addEventListener('click', onClick); return { b, r };
};
const stateTiles = STATE_TILES.map(n => ({ n, ...mkTile(document.getElementById('states'), n, { state: n }, () => setState(n)) }));
const variantTiles = VARIANT_TILES.map(n => ({ n, ...mkTile(document.getElementById('variants'), n, { variant: n }, () => setVariant(n)) }));

const pills = (host, list, fn) => list.map(n => {
  const b = document.createElement('button'); b.className = 'pill'; b.type = 'button'; b.textContent = n; b.addEventListener('click', () => fn(n)); host.append(b); return { n, b };
});
const sp = pills(document.getElementById('statePills'), ALL_STATES, n => setState(n));
const vp = pills(document.getElementById('variantPills'), VARIANT_TILES, n => setVariant(n));

function setState(n) {
  curState = n; hero.setState(n);
  sp.forEach(p => p.b.setAttribute('aria-pressed', p.n === n));
  stateTiles.forEach(t => t.b.setAttribute('aria-pressed', t.n === n));
}
function setVariant(n) {
  curVariant = n; hero.setVariant(n);
  vp.forEach(p => p.b.setAttribute('aria-pressed', p.n === n));
  variantTiles.forEach(t => t.b.setAttribute('aria-pressed', t.n === n));
}
setState('idle'); setVariant('standard');

// scenes
make(document.getElementById('peek'), 300, { state: 'working' });
make(document.getElementById('work'), 260, { state: 'working', variant: 'crown' });

// auto showcase until the user touches something
let idleTimer;
const loop = ['idle', 'working', 'thinking', 'question', 'finished'];
let i = 0;
const tick = () => { if (!reduce) { setState(loop[++i % loop.length]); } idleTimer = setTimeout(tick, 3200); };
idleTimer = setTimeout(tick, 3200);
document.addEventListener('click', () => clearTimeout(idleTimer), { capture: true, once: true });

// stop animating when the page is hidden / canvases offscreen
const io = new IntersectionObserver(es => es.forEach(e => {
  const r = rigs.find(x => x.canvas === e.target); if (!r) return; e.isIntersecting ? r.start() : r.stop();
}));
rigs.forEach(r => io.observe(r.canvas));
</script>
</body>
</html>
